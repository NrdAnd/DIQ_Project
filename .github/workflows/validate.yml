name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check environment
        run: python -m pip check
      - name: Validate source and historical snapshots
        run: python scripts/validate_repository.py
      - name: Execute portable notebook
        run: python scripts/execute_notebook.py
      - name: Validate regenerated artefacts
        run: python scripts/validate_repository.py --generated
